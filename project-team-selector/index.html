<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подбор участников проекта</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Подбор участников проекта</h1>

    <p class="subtitle">
        Добавьте участников проекта и их интересы.
    </p>

    <div class="form">

        <input
            type="text"
            id="name"
            placeholder="Имя участника">

        <input
            type="text"
            id="interest"
            placeholder="Интересы">

        <button id="addBtn">
            Добавить участника
        </button>

    </div>

    <h2>Участники</h2>

    <ul id="list"></ul>

</div>

<script src="script.js"></script>

</body>
</html>
