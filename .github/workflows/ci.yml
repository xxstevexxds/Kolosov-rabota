name: Проверка проекта

on:
  push:
    branches:
      - main
      - feature/ci
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Синтаксис и тесты
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить проект
        run: npm test
